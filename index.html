<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Extractor</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-[#fcfaf8] text-[#1c140d] font-sans p-8">
  <header class="border-b border-[#f4ede7] pb-4 mb-6">
    <h1 class="text-2xl font-bold">Link Extractor</h1>
    <p class="text-sm text-[#5b4f45] mt-2 max-w-3xl">
      Paste one or more page URLs below and the app will crawl each page, collect all
      discovered hyperlinks, and display them in the table.
    </p>
  </header>

  <main class="max-w-4xl space-y-6">
    <section class="space-y-3">
      <label for="urls" class="block text-sm font-medium">Page URLs (one per line)</label>
      <textarea id="urls" rows="5" placeholder="https://example.com/article"
        class="w-full p-3 rounded bg-[#f4ede7] border border-transparent focus:border-[#f27f0c] focus:outline-none"></textarea>
      <button id="checkBtn" class="bg-[#f27f0c] px-6 py-2 rounded text-white font-bold transition disabled:opacity-60">
        Extract Links
      </button>
      <div id="progress-container" class="hidden h-1 bg-[#2A2A2A] rounded overflow-hidden">
        <div id="progress-bar" class="h-full bg-[#3AD9A5] w-0 transition-all"></div>
      </div>
    </section>

    <section>
      <table class="table-fixed w-full border border-[#e8dbce] rounded-lg overflow-hidden" id="resultsTable">
        <thead class="bg-[#f4ede7] text-left">
          <tr class="divide-x divide-[#e8dbce]">
            <th class="px-4 py-2 w-1/4">Page URL</th>
            <th class="px-4 py-2 w-1/6">Link Count</th>
            <th class="px-4 py-2">Links Found</th>
            <th class="px-4 py-2 w-1/5">Status</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-[#e8dbce]"></tbody>
      </table>
    </section>
  </main>

  <script>
    const checkBtn = document.getElementById('checkBtn');
    const progressCt = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const resultsBody = document.querySelector('#resultsTable tbody');

    function setBusy(busy) {
      checkBtn.disabled = busy;
      if (busy) {
        checkBtn.classList.add('opacity-60');
      } else {
        checkBtn.classList.remove('opacity-60');
      }
    }

    checkBtn.addEventListener('click', async () => {
      const urls = document.getElementById('urls')
        .value
        .split('\n')
        .map(u => u.trim())
        .filter(Boolean);

      if (!urls.length) {
        alert('Please enter at least one URL.');
        return;
      }

      resultsBody.innerHTML = '';
      progressCt.classList.remove('hidden');
      progressBar.style.width = '0%';
      setBusy(true);

      let results = [];
      try {
        progressBar.style.width = '30%';
        const response = await fetch('/api/check-links', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ urls })
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || `Request failed with status ${response.status}`);
        }

        results = await response.json();
      } catch (error) {
        console.error(error);
        alert(`Something went wrong: ${error.message}`);
        progressCt.classList.add('hidden');
        progressBar.style.width = '0%';
        setBusy(false);
        return;
      }

      progressBar.style.width = '100%';
      setTimeout(() => progressCt.classList.add('hidden'), 200);
      setBusy(false);

      results.forEach(item => {
        const tr = document.createElement('tr');
        const links = Array.isArray(item.links) ? item.links : [];
        const status = item.error
          ? `${item.status || ''}<div class="text-sm text-red-600">${item.error}</div>`
          : item.status || '';

        const linkHtml = links.map(link => (
          `<a href="${link}" class="underline text-blue-600" target="_blank" rel="noopener noreferrer">${link}</a>`
        )).join('<br />');

        tr.innerHTML = `
          <td class="px-4 py-2 align-top break-all">${item.url}</td>
          <td class="px-4 py-2 align-top">${links.length}</td>
          <td class="px-4 py-2 align-top space-y-1">${linkHtml}</td>
          <td class="px-4 py-2 align-top">${status}</td>
        `;

        resultsBody.append(tr);
      });
    });
  </script>
</body>
</html>
